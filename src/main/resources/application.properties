spring.application.name=Quotation

# ============================================================
# Solar CRM - Quotation backend
# ============================================================

server.port=8091

# ---- MySQL ----
# The database is created automatically (createDatabaseIfNotExist=true).
spring.datasource.url=jdbc:mysql://localhost:3306/solar_crm?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Hibernate creates and updates the tables from the entities on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# data.sql seeds roles, modules, permissions, the PLATFORM tenant and the first Super Admin.
# It runs on every start and is written to be idempotent (see the comments inside data.sql).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- JWT ----
# These names are the ones JwtUtil reads (@Value("${sqms.jwt.secret}") and ${sqms.jwt.access-token-minutes}).
# The old jwt.secret / jwt.expiration-ms keys are not read by anything and were removed.
# Replace the secret with an environment variable (at least 32 characters) in every real environment.
sqms.jwt.secret=${JWT_SECRET:solar-crm-dev-only-secret-key-please-change-me-before-prod-0123456789}
sqms.jwt.access-token-minutes=15
sqms.jwt.refresh-token-days=7
sqms.jwt.refresh-token-days-remember-me=30

# ---- CORS ----
# Comma separated frontend origins, for example http://localhost:5500,http://127.0.0.1:5500
# * is fine for local development only.
app.cors.allowed-origins=*